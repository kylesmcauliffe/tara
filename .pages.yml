# .pages.yml — Pages CMS config for Wedding Website (Astro content collections)

media:
  name: images
  label: Images
  input: src/images
  output: src/images
  path: "" # start at src/images
  extensions: [png, jpg, jpeg, webp, svg]

settings:
  content:
    merge: true

content:
  # ---------------------
  # BLOG POSTS
  # ---------------------
  - name: posts
    label: Blog Posts
    type: collection
    path: src/content/posts
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, pubDate]
      sort: [pubDate]
      default: { sort: pubDate, order: desc }
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: pubDate
        label: Publication Date
        type: date
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: image
        label: Cover Image
        type: object
        required: true
        fields:
          - name: url
            label: Image
            type: image
            options:
              media: images
              path: blog
          - name: alt
            label: Alt text
            type: string
      - name: tags
        label: Tags
        type: string
        list: true
        required: true
      - name: body
        label: Body
        type: rich-text

  # ---------------------
  # WEDDING PARTY & PEOPLE
  # ---------------------
  - name: people
    label: Wedding Party
    type: collection
    path: src/content/people
    filename: "{primary}.md"
    view:
      primary: name
      fields: [name, role, order]
      sort: [order]
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Role
        type: string
        required: true
      - name: bio
        label: Bio/Description
        type: text
      - name: image
        label: Photo
        type: object
        fields:
          - name: url
            label: Image
            type: image
            options:
              media: images
              path: people
          - name: alt
            label: Alt text
            type: string
      - name: order
        label: Display Order
        type: number
      - name: body
        label: Story/Details
        type: rich-text

  # ---------------------
  # WEDDING EVENTS
  # ---------------------
  - name: events
    label: Wedding Events
    type: collection
    path: src/content/events
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, date, isMainEvent, order]
      sort: [order]
    fields:
      - name: title
        label: Event Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: date
        label: Date
        type: date
        required: true
      - name: startTime
        label: Start Time
        type: string
      - name: endTime
        label: End Time
        type: string
      - name: locationSlug
        label: Location
        type: string
      - name: isMainEvent
        label: Main Event
        type: boolean
        default: false
      - name: order
        label: Display Order
        type: number
      - name: image
        label: Event Image
        type: object
        fields:
          - name: url
            label: Image
            type: image
            options:
              media: images
              path: events
          - name: alt
            label: Alt text
            type: string
      - name: body
        label: Event Details
        type: rich-text

  # ---------------------
  # LOCATIONS & VENUES
  # ---------------------
  - name: locations
    label: Locations & Venues
    type: collection
    path: src/content/locations
    filename: "{primary}.md"
    view:
      primary: name
      fields: [name, type, city, order]
      sort: [order]
    fields:
      - name: name
        label: Venue Name
        type: string
        required: true
      - name: type
        label: Type
        type: string
      - name: address
        label: Address
        type: string
        required: true
      - name: city
        label: City
        type: string
      - name: country
        label: Country
        type: string
      - name: mapUrl
        label: Map URL
        type: string
      - name: notes
        label: Notes
        type: text
      - name: order
        label: Display Order
        type: number
      - name: body
        label: Venue Details
        type: rich-text

  # ---------------------
  # PHOTO GALLERY
  # ---------------------
  - name: gallery
    label: Photo Gallery
    type: collection
    path: src/content/gallery
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, order]
      sort: [order]
    fields:
      - name: title
        label: Album Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: coverImage
        label: Cover Image
        type: object
        fields:
          - name: url
            label: Image
            type: image
            options:
              media: images
              path: gallery
          - name: alt
            label: Alt text
            type: string
      - name: images
        label: Gallery Images
        type: object
        list: true
        fields:
          - name: url
            label: Image
            type: image
            options:
              media: images
              path: gallery
          - name: alt
            label: Alt text
            type: string
          - name: caption
            label: Caption
            type: string
          - name: order
            label: Order
            type: number
      - name: order
        label: Album Order
        type: number
      - name: body
        label: Album Description
        type: rich-text

  # ---------------------
  # WEDDING WISHLIST
  # ---------------------
  - name: wishlist
    label: Wedding Wishlist
    type: collection
    path: src/content/wishlist
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, status, category, price]
      sort: [title]
    fields:
      - name: title
        label: Gift Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: link
        label: Purchase Link
        type: string
        required: true
      - name: price
        label: Price
        type: string
      - name: category
        label: Category
        type: string
      - name: store
        label: Store
        type: string
      - name: status
        label: Status
        type: string
        options: [Available, Reserved, Fulfilled]
        default: Available
      - name: image
        label: Product Image
        type: object
        fields:
          - name: url
            label: Image
            type: image
            options:
              media: images
              path: wishlist
          - name: alt
            label: Alt text
            type: string
      - name: body
        label: Additional Details
        type: rich-text